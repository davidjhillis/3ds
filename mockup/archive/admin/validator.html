<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Validator - Admin Dashboard</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .test-pass { @apply text-green-400; }
    .test-warn { @apply text-amber-400; }
    .test-fail { @apply text-red-400; }
  </style>
</head>
<body class="bg-[#252525] text-white">

  <div class="min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-[#1a1a1a] border-b border-white/[0.08] px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="index.html" class="hover:opacity-80 transition-opacity">
            <i data-lucide="arrow-left" class="w-5 h-5 text-white/60"></i>
          </a>
          <div>
            <h1 class="text-lg font-semibold text-white">Theme Validator</h1>
            <p class="text-xs text-white/40">Accessibility & compliance checking</p>
          </div>
        </div>
        <button id="run-all-tests" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2">
          <i data-lucide="play" class="w-4 h-4"></i>
          <span>Run All Tests</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
      
      <!-- Test Results Summary -->
      <div class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-[#0a0a0a] border border-white/[0.08] rounded-lg p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-green-500/10 flex items-center justify-center">
              <i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i>
            </div>
            <div>
              <div class="text-2xl font-bold text-green-400" id="pass-count">0</div>
              <div class="text-xs text-white/50">Tests Passed</div>
            </div>
          </div>
        </div>
        
        <div class="bg-[#0a0a0a] border border-white/[0.08] rounded-lg p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-amber-500/10 flex items-center justify-center">
              <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-400"></i>
            </div>
            <div>
              <div class="text-2xl font-bold text-amber-400" id="warn-count">0</div>
              <div class="text-xs text-white/50">Warnings</div>
            </div>
          </div>
        </div>
        
        <div class="bg-[#0a0a0a] border border-white/[0.08] rounded-lg p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center">
              <i data-lucide="x-circle" class="w-5 h-5 text-red-400"></i>
            </div>
            <div>
              <div class="text-2xl font-bold text-red-400" id="fail-count">0</div>
              <div class="text-xs text-white/50">Failures</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Test Categories -->
      <div class="space-y-4" id="test-results">
        <!-- Populated dynamically -->
      </div>

    </main>
    
  </div>

  <script type="module">
    import { radixThemes, getColorScale } from './assets/radix-themes.js';
    
    lucide.createIcons();

    let testResults = {
      pass: 0,
      warn: 0,
      fail: 0,
      tests: []
    };

    // ========================================
    // Accessibility Tests
    // ========================================
    
    function calculateContrast(color1, color2) {
      // Convert hex to RGB
      const hex1 = color1.replace('#', '');
      const hex2 = color2.replace('#', '');
      
      const r1 = parseInt(hex1.substr(0,2), 16) / 255;
      const g1 = parseInt(hex1.substr(2,2), 16) / 255;
      const b1 = parseInt(hex1.substr(4,2), 16) / 255;
      
      const r2 = parseInt(hex2.substr(0,2), 16) / 255;
      const g2 = parseInt(hex2.substr(2,2), 16) / 255;
      const b2 = parseInt(hex2.substr(4,2), 16) / 255;
      
      // Calculate relative luminance
      const lum1 = 0.2126 * (r1 <= 0.03928 ? r1/12.92 : Math.pow((r1+0.055)/1.055, 2.4)) +
                   0.7152 * (g1 <= 0.03928 ? g1/12.92 : Math.pow((g1+0.055)/1.055, 2.4)) +
                   0.0722 * (b1 <= 0.03928 ? b1/12.92 : Math.pow((b1+0.055)/1.055, 2.4));
      
      const lum2 = 0.2126 * (r2 <= 0.03928 ? r2/12.92 : Math.pow((r2+0.055)/1.055, 2.4)) +
                   0.7152 * (g2 <= 0.03928 ? g2/12.92 : Math.pow((g2+0.055)/1.055, 2.4)) +
                   0.0722 * (b2 <= 0.03928 ? b2/12.92 : Math.pow((b2+0.055)/1.055, 2.4));
      
      // Calculate contrast ratio
      const ratio = lum1 > lum2 
        ? (lum1 + 0.05) / (lum2 + 0.05)
        : (lum2 + 0.05) / (lum1 + 0.05);
      
      return ratio;
    }

    function testColorContrast(colorName, mode = 'dark') {
      const scale = getColorScale(colorName, mode);
      const bg = scale[1]; // Background color
      const text11 = scale[11]; // Text color (step 11)
      const text12 = scale[12]; // Text color (step 12)
      
      const contrast11 = calculateContrast(bg, text11);
      const contrast12 = calculateContrast(bg, text12);
      
      const tests = [];
      
      // WCAG AA requires 4.5:1 for normal text, 3:1 for large text
      tests.push({
        name: `${capitalize(colorName)} - Step 11 on Background (${contrast11.toFixed(2)}:1)`,
        status: contrast11 >= 4.5 ? 'pass' : contrast11 >= 3 ? 'warn' : 'fail',
        message: contrast11 >= 4.5 
          ? `Excellent! Meets WCAG AA (${contrast11.toFixed(2)}:1)` 
          : contrast11 >= 3
            ? `Passes for large text only (${contrast11.toFixed(2)}:1)`
            : `Fails WCAG AA (${contrast11.toFixed(2)}:1). Needs 4.5:1 minimum`,
        wcag: contrast11 >= 4.5 ? 'AA' : contrast11 >= 3 ? 'AA Large' : 'Fail'
      });
      
      tests.push({
        name: `${capitalize(colorName)} - Step 12 on Background (${contrast12.toFixed(2)}:1)`,
        status: contrast12 >= 7 ? 'pass' : contrast12 >= 4.5 ? 'warn' : 'fail',
        message: contrast12 >= 7 
          ? `Excellent! Meets WCAG AAA (${contrast12.toFixed(2)}:1)` 
          : contrast12 >= 4.5
            ? `Meets WCAG AA (${contrast12.toFixed(2)}:1)`
            : `Fails WCAG AA (${contrast12.toFixed(2)}:1)`,
        wcag: contrast12 >= 7 ? 'AAA' : contrast12 >= 4.5 ? 'AA' : 'Fail'
      });
      
      return tests;
    }

    function testColorScaleIntegrity(colorName, mode = 'dark') {
      const scale = getColorScale(colorName, mode);
      const tests = [];
      
      // Check all 12 steps exist
      const steps = Object.keys(scale);
      tests.push({
        name: `${capitalize(colorName)} - Complete scale`,
        status: steps.length === 12 ? 'pass' : 'fail',
        message: steps.length === 12 
          ? `All 12 steps present` 
          : `Missing steps. Only ${steps.length}/12 found`,
        wcag: 'N/A'
      });
      
      // Check color progression (each step should be different)
      const uniqueColors = new Set(Object.values(scale));
      tests.push({
        name: `${capitalize(colorName)} - Unique steps`,
        status: uniqueColors.size === 12 ? 'pass' : 'warn',
        message: uniqueColors.size === 12
          ? `All colors are unique`
          : `${12 - uniqueColors.size} duplicate color(s) detected`,
        wcag: 'N/A'
      });
      
      return tests;
    }

    function testRadixPatternCompliance() {
      const tests = [];
      
      // Test: Using steps 11-12 for text
      tests.push({
        name: 'Text Color Usage',
        status: 'pass',
        message: 'Following Radix pattern: Steps 11-12 for accessible text',
        wcag: 'Built-in'
      });
      
      // Test: Using steps 1-3 for backgrounds
      tests.push({
        name: 'Background Color Usage',
        status: 'pass',
        message: 'Following Radix pattern: Steps 1-3 for app backgrounds',
        wcag: 'Built-in'
      });
      
      // Test: Using steps 9 for solid colors
      tests.push({
        name: 'Solid Color Usage',
        status: 'pass',
        message: 'Following Radix pattern: Step 9 for solid backgrounds',
        wcag: 'Built-in'
      });
      
      return tests;
    }

    // ========================================
    // Run Tests
    // ========================================
    
    function runAllTests() {
      testResults = {
        pass: 0,
        warn: 0,
        fail: 0,
        tests: []
      };
      
      // Test all color modes
      const colors = ['indigo', 'blue', 'green', 'ruby', 'amber', 'violet'];
      const modes = ['dark', 'light'];
      
      modes.forEach(mode => {
        const modeTests = {
          name: `${capitalize(mode)} Mode`,
          tests: []
        };
        
        colors.forEach(color => {
          // Contrast tests
          const contrastTests = testColorContrast(color, mode);
          modeTests.tests.push(...contrastTests);
          
          // Integrity tests
          const integrityTests = testColorScaleIntegrity(color, mode);
          modeTests.tests.push(...integrityTests);
        });
        
        // Radix pattern compliance
        if (mode === 'dark') {
          const patternTests = testRadixPatternCompliance();
          modeTests.tests.push(...patternTests);
        }
        
        testResults.tests.push(modeTests);
      });
      
      // Count results
      testResults.tests.forEach(category => {
        category.tests.forEach(test => {
          if (test.status === 'pass') testResults.pass++;
          else if (test.status === 'warn') testResults.warn++;
          else if (test.status === 'fail') testResults.fail++;
        });
      });
      
      renderResults();
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function renderResults() {
      // Update summary
      document.getElementById('pass-count').textContent = testResults.pass;
      document.getElementById('warn-count').textContent = testResults.warn;
      document.getElementById('fail-count').textContent = testResults.fail;
      
      // Render test details
      const container = document.getElementById('test-results');
      container.innerHTML = testResults.tests.map(category => `
        <div class="bg-[#0a0a0a] border border-white/[0.08] rounded-lg overflow-hidden">
          <div class="px-5 py-4 border-b border-white/[0.08]">
            <h2 class="text-sm font-semibold text-white">${category.name}</h2>
            <p class="text-xs text-white/40 mt-1">${category.tests.length} tests</p>
          </div>
          <div class="divide-y divide-white/[0.05]">
            ${category.tests.map(test => `
              <div class="px-5 py-3 hover:bg-white/[0.02] transition-colors">
                <div class="flex items-start justify-between gap-4">
                  <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                      <i data-lucide="${test.status === 'pass' ? 'check-circle' : test.status === 'warn' ? 'alert-circle' : 'x-circle'}" class="w-4 h-4 test-${test.status}"></i>
                      <span class="text-sm font-medium text-white/90">${test.name}</span>
                    </div>
                    <p class="text-xs text-white/50 pl-6">${test.message}</p>
                  </div>
                  <div class="flex-shrink-0">
                    <span class="px-2 py-1 rounded text-[10px] font-semibold ${
                      test.wcag === 'AAA' ? 'bg-green-500/20 text-green-400' :
                      test.wcag === 'AA' || test.wcag === 'Built-in' ? 'bg-blue-500/20 text-blue-400' :
                      test.wcag === 'AA Large' ? 'bg-amber-500/20 text-amber-400' :
                      test.wcag === 'Fail' ? 'bg-red-500/20 text-red-400' :
                      'bg-white/5 text-white/30'
                    }">${test.wcag}</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
      
      lucide.createIcons();
    }

    // ========================================
    // Event Listeners
    // ========================================
    
    document.getElementById('run-all-tests').addEventListener('click', runAllTests);

    // Auto-run on load
    setTimeout(runAllTests, 500);
  </script>

</body>
</html>
